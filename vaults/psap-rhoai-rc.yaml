env_key: PSAP_RHOAI_RC_SECRET_PATH
description: |
  Vault containing credentials for the RHOAI release-candidate registry

content:
  rhoai_rc.secret:
    description: |
      Basic auth string used to extend the cluster pull secret for quay.io/rhoai
    sample: |
      rhoai+rhoai_external_readonly_bot:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
