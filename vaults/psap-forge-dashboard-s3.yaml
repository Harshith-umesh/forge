env_key: PSAP_FORGE_DASHBOARD_S3_SECRET_PATH
description: |
  AWS credentials for rhaiis dashboard CSV sync (psap-dashboard-data)
  and profiler trace uploads. Ported from model-furnace s3-uploader.conf.

content:
  aws.credentials:
    description: |
      AWS credentials file (INI format). The key must have
      s3:GetObject, s3:PutObject, s3:CopyObject on:
        - psap-dashboard-data  (CSV dashboard, profiler traces)
        - psap-model-furnace   (vLLM logs)
    sample: |
      [default]
      aws_access_key_id = AKIA...
      aws_secret_access_key = .....
