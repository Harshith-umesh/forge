# Nightly pipeline: clusterless job that checks for new image versions
# and conditionally triggers a full test FournosJob.
#
# Flow: receive-image (resolve latest version) → confirm-nightly (compare with S3, create FournosJob if new)
#
# This pipeline runs as a clusterless FournosJob (no target cluster needed).
# Both tasks use the standard forge-step, dispatching to phases registered
# in the project's ci.py (backed by shared handlers in projects/core/nightly/).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: nightly
  annotations:
    fournos.dev/resolve-image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/forge-core:latest
spec:
  workspaces:
    - name: artifacts
  params:
    - name: fjob-name
      type: string
    - name: fournos-workload-namespace
      type: string
    - name: kubeconfig-secret
      type: string
  tasks:
    - name: 00-receive-image
      taskRef:
        name: forge-step
        kind: Task
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: fjob-name
          value: "$(params.fjob-name)"
        - name: fournos-workload-namespace
          value: "$(params.fournos-workload-namespace)"
        - name: kubeconfig-secret
          value: "$(params.kubeconfig-secret)"
        - name: job-step
          value: receive-image
        - name: job-step-name
          value: 00__receive-image

    - name: 01-confirm-nightly
      runAfter: [00-receive-image]
      taskRef:
        name: forge-step
        kind: Task
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: fjob-name
          value: "$(params.fjob-name)"
        - name: fournos-workload-namespace
          value: "$(params.fournos-workload-namespace)"
        - name: kubeconfig-secret
          value: "$(params.kubeconfig-secret)"
        - name: job-step
          value: confirm-nightly
        - name: job-step-name
          value: 01__confirm-nightly
