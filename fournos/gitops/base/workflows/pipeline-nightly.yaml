# Nightly pipeline: clusterless job that checks for new image versions
# and conditionally triggers a full test FournosJob.
#
# Single step that resolves the latest version, compares against the last
# tested version, and creates a FournosJob if a new version is detected.
# Error visibility is handled via notification files in the artifact directory.
#
# This pipeline runs as a clusterless FournosJob (no target cluster needed).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: nightly
  annotations:
    fournos.dev/resolve-image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/forge-core:latest
spec:
  workspaces:
    - name: artifacts
  params:
    - name: fjob-name
      type: string
    - name: fournos-workload-namespace
      type: string
    - name: kubeconfig-secret
      type: string
  tasks:
    - name: 00-nightly
      taskRef:
        name: forge-step
        kind: Task
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: fjob-name
          value: "$(params.fjob-name)"
        - name: fournos-workload-namespace
          value: "$(params.fournos-workload-namespace)"
        - name: kubeconfig-secret
          value: "$(params.kubeconfig-secret)"
        - name: job-step
          value: nightly
        - name: job-step-name
          value: 00__nightly

  finally:
    - name: 01-export-artifacts
      taskRef:
        name: forge-step
        kind: Task
      workspaces:
        - name: artifacts
          workspace: artifacts
      params:
        - name: fjob-name
          value: "$(params.fjob-name)"
        - name: fournos-workload-namespace
          value: "$(params.fournos-workload-namespace)"
        - name: kubeconfig-secret
          value: "$(params.kubeconfig-secret)"
        - name: job-step
          value: export-artifacts
        - name: job-step-name
          value: 01__export-artifacts
