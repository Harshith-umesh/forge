nightly:
  sources:
    ghcr:
      receiver: "projects.mcp_gateway.nightly_resolvers.ghcr_receiver.GHCRReceiver"
      repo: "Kuadrant/mcp-gateway"
      image: "kuadrant/mcp-gateway"
      mlflow_experiment: "mcp-gw-cpt-ghcr"
  verifier: "projects.caliper.orchestration.mlflow_verifier.CaliperMLflowVerifier"
  mlflow_verifier:
    version_pattern: "-v(.+?)-\\d{8}-\\d{6}$"
    strip_prefix: "sha-"
  cluster: "forge-smoke-testing"
  version_key: "infrastructure.mcp_gateway_version"
  pipeline: "forge-full"
  preset: "demo"
  owner: "ashtakb"

vaults:
  all: []
  all-optional:
  - psap-forge-notifications
  - psap-forge-mlflow-export
  prepare: []
  test: []

notifications:
  slack:
    channel_id: C0BEBS6929L
    provider_module: projects.mcp_gateway.orchestration.notifications.MCPGatewaySlackProvider

metrics:
  enabled: true
  namespaces:
    - mcp-gw-bench
    - mcp-system
    - gateway-system
    - istio-system
  step_seconds: 15
  query_keys: []  # empty = all queries from queries.yaml

caliper:
  postprocess:
    enabled: true
    artifacts_dir: null
    plugin_module: projects.mcp_gateway.postprocess.mcp_gateway.plugin
    postprocess_config: null
    parse:
      enabled: true
      no_cache: false
    visualize:
      enabled: false
    kpi:
      enabled: true
      artifacts_to_kpis:
        enabled: true
        output: kpis.json
    analyze:
      enabled: false
      historical_kpis: null
      output: kpi_analyze.json

  export:
    from: null
    verbose: true
    dry_run: false
    backend:
      mlflow:
        enabled: true
        secrets:
          vault:
            name: psap-forge-mlflow-export
            mlflow_secret: mlflow-secret.yaml
        config:
          run_name:
          experiment: mcp-gateway-cpt
          workspace: mcp-gw-cpt
          description: >
            MCP Gateway performance test results
          source_script: mcp_gateway project
          tags: {}
          parameters: {}
          metrics: {}
          run_naming:
            prefix: "forge-mcp-gateway"
            single_run: "{prefix}-s{num_servers}-u{users}-v{mcp_gateway_version}-{timestamp}"
            parent_run: "{prefix}-{preset}-{mcp_gateway_version}-{timestamp}"
            child_run: "{prefix}-s{num_servers}-u{users}-v{mcp_gateway_version}-{timestamp}"
