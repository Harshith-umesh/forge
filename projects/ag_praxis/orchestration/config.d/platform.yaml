cluster:
  minimum_openshift_version: "4.19.9"
  skip_gpu_readiness: true
  namespace:
    labels:
      app.kubernetes.io/managed-by: forge
      forge.openshift.io/project: ag_praxis

maas:
  namespace: default
  repo_url: https://github.com/opendatahub-io/models-as-a-service
  repo_ref: main
  operator_type: odh
  tenant_namespace: models-as-a-service
  maas_gateway_label: maas-gateway
  llmisvc_name: sim-llm-maas
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress

sim:
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.12.0
  llmisvc_name: sim-llm
  model_name: simulated-llama-3
  served_model_names:
    - simulated-llama-3
    - simulated-llama-3-1
    - simulated-llama-3-2
    - simulated-llama-3-3
    - simulated-llama-3-4
  time_to_first_token: "800ms"
  inter_token_latency: "30ms"
  mode: random
  max_num_seqs: 10240
  gateway:
    name: ag-praxis
    namespace: openshift-ingress
    gateway_class_name: data-science-gateway-class
    status_address_name: gateway-internal
    create_if_missing: true

praxis:
  version: "0.6"
  replicas: 1

artifacts:
  capture_namespace_events: true
