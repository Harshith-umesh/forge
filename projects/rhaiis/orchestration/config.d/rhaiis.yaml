namespace: kserve-e2e-perf
accelerator: nvidia
cluster_tag: ""

gpu_types:
  nvidia: h200
  amd: mi300x
  l40s: l40s

images:
  nvidia: quay.io/aipcc/rhaiis/cuda-ubi9:3.4.0-ea.2-1773886296
  amd: quay.io/aipcc/rhaiis/rocm-ubi9:3.2.5-1766067105

engine: vllm

engines:
  vllm:
    images:
      nvidia: vllm/vllm-openai:v0.24.0
      amd: quay.io/aipcc/rhaiis/rocm-ubi9:3.2.5
    port: 8080
    args:
      gpu-memory-utilization: 0.92
      trust-remote-code: true
      no-enable-log-requests: true
      no-enable-prefix-caching: true
      uvicorn-log-level: debug
  sglang:
    images:
      nvidia: lmsysorg/sglang:v0.5.11
      amd: lmsysorg/sglang:v0.5.4.post2-rocm700-mi30x
    port: 8080
    args: {}
  trtllm:
    images:
      nvidia: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc13
    port: 8888
    args: {}
    trtllm_config: {}

deploy:
  replicas: 1
  cpu_request: "4"
  memory_request: "16Gi"
  storage_source: hf
  storage_pvc: model-pvc
  image_pull_secrets: []
  service_account_name: ""
  ready_timeout: 3600
  health_check_timeout: 120

env_vars: {}

accelerator_env_vars:
  nvidia: {}
  amd:
    VLLM_ROCM_USE_AITER: "1"

s3:
  bucket: psap-dashboard-data
  vault: psap-forge-dashboard-s3
  credentials_file: aws.credentials

warmup:
  rate: 200
  max_seconds: 60

profiler:
  enabled: false
  s3_bucket: psap-dashboard-data
  s3_prefix: pytorch-profiles/rhaiis
  vault: psap-forge-dashboard-s3
  labels: []
  rates: [200]
  max_seconds: 200

agent_analysis:
  enabled: false
  severity_threshold: 10
  url: "http://agent-gateway.psap-ai-analysis-agent-gateway.svc.cluster.local:8443/v1/stream"
