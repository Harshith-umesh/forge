# CPT Pipeline Definitions
# Forge repo path: projects/rhaiis/orchestration/presets.d/cpt.yaml
#
# Each top-level key (except __cpt) defines one CPT pipeline.
# __models: keys are preset names, values are per-model config overrides (null = global only).
# Non-__ keys at the pipeline level are global overrides applied to every job.

__cpt: true

# ──────────────────────────────────────────────
# vLLM Release — Release regression testing models
# ──────────────────────────────────────────────
cpt-vllm-release:
  __description: "vLLM Release CPT — Tier 1 models across all workload profiles"
  __engine: vllm
  __models:
    llama-70b:
    llama-70b-bf16:
    granite-8b:
      # Per-model overrides — these merge on top of the global overrides below
      rhaiis.engines.vllm.args.gpu-memory-utilization: 0.95
    granite-8b-bf16:
    mistral-24b:
    mistral-24b-bf16:
    qwen25-7b:
    qwen25-7b-bf16:
  __workloads:
    - ci-quick
    - profile1
    - profile2
    - profile3
    - profile4
  rhaiis.profiler.enabled: true
  tests.rhaiis.run_benchmark: true
  caliper.postprocess.csv_dashboard.enabled: true
  tests.rhaiis.slack_notify_always: true
  rhaiis.agent_analysis.enabled: false

