__multiple: true

janus:
  runtime.namespace: kpouget-dev

  # Use ReadWriteMany for model cache PVC in CKS environment
  model_cache.pvc.access_mode: ReadWriteMany
  model_cache.pvc.storage_class_name: nfs
  deployments.pd.resources: composite.dra.io/gpu-nic-pair
  platform.gateway.status_address_name: null
  platform.gateway.status_address_name: gateway-internal

  cpt.kpi.labels.platform_name: OCP
  cpt.kpi.labels.gpu_type: H200
  cpt.kpi.labels.test_harness: xks

janus-intelligent:
  extends:
  - janus
  - cpt
  - llama3-70b

  runtime.deployment_profile:
  - intelligentrouting-tp2-x4
  - simple-tp2-x4

  runtime.benchmark_key:
  - heavy-heterogeneous
  - multi-turn

janus-pd:
  extends:
  - janus
  - cpt
  - gpt-oss

  runtime.deployment_profile:
  - pd-p.tp1-p.x8-d.tp4-d.x2
  - simple-tp4-x4
  - intelligent-tp4-x4

  runtime.benchmark_key:
  - heavy-heterogeneous
  - multi-turn

janus-smoke:
  extends:
  - janus
  - llama3-70b
  #- gpt-oss

  runtime.deployment_profile:
  - pd-p.tp1-p.x8-d.tp4-d.x2

  runtime.benchmark_key:
  - short
