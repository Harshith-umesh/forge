__multiple: true

# CPT reference profiles
cpt-reference-flavors:
  extends:
  - gpt-oss
  runtime.deployment_profile:
  - pd-d.x2-p.tp1-d.tp4-p.x8
  - intelligentrouting-tp4-x4
  - simple-tp4-x4

cpt:
  caliper.export.backend.mlflow.config.experiment: cpt-llm-d
  cpt.kpi.labels.test_harness: rhoai-release

cpt-release-testing-gpt-oss-120b:
  extends:
  - cpt
  - gpt-oss
  runtime.benchmark_key:
  - concurrent-1k-1k
  - heavy-heterogeneous
  - multi-turn

cpt-release-testing-llama-33-70b:
  extends:
  - cpt
  runtime.selected_preset: cpt-release-testing-llama-33-70b
  runtime.model_name: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  runtime.deployment_profile:
  - release-distributed-default
  - release-precise-prefix-cache
  - release-approximate-prefix-cache
  runtime.smoke_request_key: default
  runtime.benchmark_key:
  - concurrent-1k-1k
  - heavy-heterogeneous
  - multi-turn
  model_cache.pvc.size: 300Gi
  platform.operators.rhods-operator.channel: beta
  workloads.args:
    request_type: text_completions
