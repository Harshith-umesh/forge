__multiple: true

deployment-approximate-prefix-cache:
  runtime.deployment_profile: approximate-prefix-cache

deployment-precise-prefix-cache:
  runtime.deployment_profile: precise-prefix-cache

deployment-distributed-default:
  runtime.deployment_profile: distributed-default

smoke-base:
  runtime.model_name: Qwen/Qwen3-0.6B
  runtime.smoke_request_key: default
  runtime.benchmark_key: null

smoke:
  extends:
    - smoke-base
    - deployment-approximate-prefix-cache
  runtime.benchmark_key: short
  platform.gateway.status_address_name: gateway-internal

smoke-precise:
  extends:
    - smoke-base
    - deployment-precise-prefix-cache

smoke-default-scheduler:
  extends:
    - smoke-base
    - deployment-distributed-default

benchmark-short:
  extends:
    - deployment-approximate-prefix-cache
  runtime.model_name: meta-llama/Llama-3.1-8B-Instruct
  runtime.smoke_request_key: default
  runtime.benchmark_key: short

gpt-oss-120b-inference-scheduling-release:
  extends:
    - gpt-oss
  runtime.benchmark_key:
    - concurrent-1k-1k
    - heavy-heterogeneous
    - multi-turn

llama-33-70b-rhoai-release:
  runtime.selected_preset: llama-33-70b-rhoai-release
  runtime.model_name: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  runtime.deployment_profile:
    - distributed-default
    - precise-prefix-cache
    - approximate-prefix-cache
  runtime.smoke_request_key: default
  runtime.benchmark_key:
    - concurrent-1k-1k
    - heavy-heterogeneous
    - multi-turn
  model_cache.pvc.size: 300Gi
  platform.operators.rhods-operator.channel: beta
  workloads.args:
    request_type: text_completions
