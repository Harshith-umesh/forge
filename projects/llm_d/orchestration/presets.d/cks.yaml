__multiple: true

cks:
  runtime.namespace: kpouget-dev
  platform.cluster.namespace.labels: {}

  runtime.kserve.wait_readiness: false
  runtime.kueue.enabled: true
  runtime.kueue.queue_name: llm-d-cluster-queue
  runtime.kueue.disable_above_n_gpus: 8

  # Use ReadWriteMany for model cache PVC in CKS environment
  model_cache.pvc.access_mode: ReadWriteMany
  platform.gateway.status_address_name: gateway-internal
  platform.preflight.check_crds: false
  runtime.kserve.wait_long_scheduling: true
  platform.inference_service.scheduler.node_selector:
    gpu.nvidia.com/class: H200

  cpt.kpi.labels.platform_name: CKS
  cpt.kpi.labels.gpu_type: H200
  cpt.kpi.labels.test_harness: xks

cks-intelligent:
  extends:
  - cks
  - cpt
  - llama3-70b

  runtime.deployment_profile:
  - intelligentrouting-tp2-x4
  - simple-tp2-x4

  runtime.benchmark_key:
  - heavy-heterogeneous
  - multi-turn

cks-pd:
  extends:
  - cks
  - cpt
  - gpt-oss

  runtime.deployment_profile:
  - pd-p.tp1-p.x8-d.tp4-d.x2
  - simple-tp4-x4
  - intelligent-tp4-x4

  runtime.benchmark_key:
  - heavy-heterogeneous
  - multi-turn

cks-smoke:
  extends:
  - cks
  #- llama3-70b
  #- gpt-oss

  runtime.deployment_profile:
  - intelligentrouting-tp1-x2
  - simple-tp1-x1
  - pd-d.x1-p.tp1-d.tp1-p.x1

  runtime.benchmark_key:
  - short
