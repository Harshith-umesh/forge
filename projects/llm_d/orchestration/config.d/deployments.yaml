defaults:
  replicas: 1
  tensor_parallelism: 1
  vllm_args:
    - --max-model-len=4096
    - --gpu-memory-utilization=0.92
    - --trust-remote-code
    - --no-enable-log-requests
    - --enable-prefix-caching

approximate-prefix-cache:
  scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml

precise-prefix-cache:
  scheduler_manifest: manifests/deployments/precise-prefix-cache.yaml

distributed-default:
  scheduler: {}

# Template flavor configurations with name-based extraction
template__pd:
  scheduler_manifest: manifests/deployments/pd-scheduler.yaml
  tensor_parallelism: FROM_NAME
  use_kserve_defaults: true
  pd_config:
    prefill_pods: FROM_NAME
    decode_pods: FROM_NAME
    scheduler_config: "high-throughput"

template__intelligentrouting:
  use_kserve_defaults: true
  scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml
  tensor_parallelism: FROM_NAME
  replicas: FROM_NAME
  scheduler: {}  # scheduler enabled with default config

template__simple:
  tensor_parallelism: FROM_NAME
  replicas: FROM_NAME
  use_kserve_defaults: true
  scheduler: null # scheduler disabled
