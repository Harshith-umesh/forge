defaults:
  replicas: 1
  tensor_parallelism: 1
  vllm_args:
    - --max-model-len=4096
    - --gpu-memory-utilization=0.92
    - --trust-remote-code
    - --no-enable-log-requests
    - --enable-prefix-caching

approximate-prefix-cache:
  scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml

precise-prefix-cache:
  scheduler_manifest: manifests/deployments/precise-prefix-cache.yaml

distributed-default:
  scheduler: {}

# P/D (Prefill/Decode) deployment profiles
pd-small:
  scheduler_manifest: manifests/deployments/pd-scheduler.yaml
  pd_config:
    prefill_pods: 2
    decode_pods: 4
    scheduler_config: "high-throughput"

pd-medium:
  scheduler_manifest: manifests/deployments/pd-scheduler.yaml
  pd_config:
    prefill_pods: 4
    decode_pods: 8
    scheduler_config: "balanced"

pd-large:
  scheduler_manifest: manifests/deployments/pd-scheduler.yaml
  pd_config:
    prefill_pods: 8
    decode_pods: 16
    scheduler_config: "low-latency"

# New flavor configurations
pd-x2-ptp4-px1-dtp4:
  scheduler_manifest: manifests/deployments/pd-scheduler.yaml
  tensor_parallelism: 4
  use_defaults: true
  pd_config:
    prefill_pods: 1  # px1
    decode_pods: 4   # dtp4
    scheduler_config: "high-throughput"

intelligentrouting-tp4-x4:
  scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml
  tensor_parallelism: 4
  replicas: 4
  use_defaults: true
  scheduler: {}  # scheduler enabled with default config

simple-tp4-x4:
  tensor_parallelism: 4
  replicas: 4
  use_defaults: true
  # No scheduler_manifest means scheduler disabled
