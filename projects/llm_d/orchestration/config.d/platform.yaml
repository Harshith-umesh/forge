cluster:
  minimum_openshift_version: "4.19.9"
  skip_gpu_readiness: false
  gpu_node_label_selector: nvidia.com/gpu.present=true
  nfd_gpu_detection_labels:
    - feature.node.kubernetes.io/pci-10de.present
    - feature.node.kubernetes.io/pci-0302_10de.present
    - feature.node.kubernetes.io/pci-0300_10de.present
  namespace:
    labels:
      app.kubernetes.io/managed-by: forge
      forge.openshift.io/project: llm_d

operators:
  openshift-cert-manager-operator:
    display_name: OpenShift Cert Manager
    namespace: openshift-cert-manager-operator
    channel: stable-v1.18
    source: redhat-operators
  leader-worker-set:
    display_name: Leader Worker Set
    namespace: openshift-lws
    channel: stable-v1.0
    source: redhat-operators
    bootstrap_crd: leaderworkersets.leaderworkerset.x-k8s.io
    bootstrap_manifest: manifests/leaderworkersetoperator.yaml
  nfd:
    display_name: Node Feature Discovery
    namespace: openshift-nfd
    channel: stable
    source: redhat-operators
    bootstrap_crd: nodefeaturediscoveries.nfd.openshift.io
    bootstrap_manifest: manifests/nfd-nodefeaturediscovery.yaml
  gpu-operator-certified:
    display_name: NVIDIA GPU Operator
    namespace: nvidia-gpu-operator
    channel: stable
    source: certified-operators
    bootstrap_crd: clusterpolicies.nvidia.com
  rhcl-operator:
    display_name: Red Hat Connectivity Link
    namespace: openshift-operators
    channel: stable
    source: redhat-operators
    cleanup_crds:
      - ztunnels.sailoperator.io
  rhods-operator:
    display_name: Red Hat OpenShift AI
    namespace: redhat-ods-operator
    channel: stable-3.x
    source: redhat-operators

rhoai:
  custom_catalog:
    enabled: false
    name: rhoai-catalog-dev
    namespace: openshift-marketplace
    image: null
    display_name: Red Hat OpenShift AI
    publisher: RHOAI Development Catalog
    pull_secret:
      vault:
        name: psap-rhoai-rc
        content: rhoai_rc.secret
    staging_pull_secret:
      vault:
        name: psap-forge-staging-image-pull
        content: .dockerconfigjson
  namespace: redhat-ods-applications
  datasciencecluster_name: default-dsc
  components:
    - kserve
  required_crds_before_dsc:
    - datascienceclusters.datasciencecluster.opendatahub.io
  required_crds_after_dsc:
    - llminferenceservices.serving.kserve.io
    - leaderworkersets.leaderworkerset.x-k8s.io

gateway:
  namespace: openshift-ingress
  name: openshift-ai-inference
  gateway_class_name: data-science-gateway-class
  status_address_name: gateway-internal
  create_if_missing: true

inference_service:
  name: llm-d
  template: manifests/llminferenceservice.yaml
  workload_deployment_name_suffix: -kserve
  image_pull_secret: null  # secret name to add to imagePullSecrets of all pod templates
  scheduler:
    node_selector:
      nvidia.com/gpu.present: "true"
    tolerations: null

artifacts:
  capture_namespace_events: true

smoke:
  pod_name: llm-d-smoke
  client_image: quay.io/curl/curl:8.21.0
  endpoint_path: /v1/completions
  request_timeout_seconds: 60

preflight:
  check_crds: true
