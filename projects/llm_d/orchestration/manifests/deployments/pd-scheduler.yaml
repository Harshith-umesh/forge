scheduler:
  template:
    containers:
      - name: main
        env:
          - name: TOKENIZER_CACHE_DIR
            value: /tmp/tokenizer-cache
          - name: HF_HOME
            value: /tmp/tokenizer-cache
          - name: TRANSFORMERS_CACHE
            value: /tmp/tokenizer-cache
          - name: XDG_CACHE_HOME
            value: /tmp
          # P/D specific environment variables
          - name: PD_PREFILL_PODS
            value: "{{ deployment_profile.pd_config.prefill_pods }}"
          - name: PD_DECODE_PODS
            value: "{{ deployment_profile.pd_config.decode_pods }}"
          - name: PD_SCHEDULER_CONFIG
            value: "{{ deployment_profile.pd_config.scheduler_config }}"
        args:
          - --cert-path
          - /var/run/kserve/tls
          - --pool-group
          - inference.networking.x-k8s.io
          - --pool-name
          - "{{ ChildName .ObjectMeta.Name `-inference-pool` }}"
          - --pool-namespace
          - "{{ .ObjectMeta.Namespace }}"
          - --zap-encoder
          - json
          - --grpc-port
          - "9002"
          - --grpc-health-port
          - "9003"
          - --secure-serving
          - --model-server-metrics-scheme
          - https
          - --config-text
          - |
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
              - type: pd-prefill-scheduler
                config:
                  prefillPods: {{ deployment_profile.pd_config.prefill_pods }}
                  schedulerStrategy: "{{ deployment_profile.pd_config.scheduler_config }}"
              - type: pd-decode-scheduler
                config:
                  decodePods: {{ deployment_profile.pd_config.decode_pods }}
                  schedulerStrategy: "{{ deployment_profile.pd_config.scheduler_config }}"
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
            schedulingProfiles:
              - name: prefill-profile
                plugins:
                  - pluginRef: pd-prefill-scheduler
                    weight: 5
                  - pluginRef: queue-scorer
                    weight: 2
                  - pluginRef: kv-cache-utilization-scorer
                    weight: 2
              - name: decode-profile
                plugins:
                  - pluginRef: pd-decode-scheduler
                    weight: 5
                  - pluginRef: queue-scorer
                    weight: 2
                  - pluginRef: kv-cache-utilization-scorer
                    weight: 2
              - name: default
                plugins:
                  - pluginRef: queue-scorer
                    weight: 2
                  - pluginRef: kv-cache-utilization-scorer
                    weight: 2
        volumeMounts:
          - name: tokenizer-cache
            mountPath: /tmp/tokenizer-cache
          - name: cachi2-cache
            mountPath: /cachi2
    volumes:
      - name: tokenizer-cache
        emptyDir: {}
      - name: cachi2-cache
        emptyDir: {}
