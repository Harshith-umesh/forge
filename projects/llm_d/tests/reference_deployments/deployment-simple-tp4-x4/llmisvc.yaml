apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llm-d-simple-tp4-x4
  namespace: forge-llm-d
  annotations:
    security.opendatahub.io/enable-auth: 'false'
    prometheus.io/path: /metrics
    prometheus.io/port: '8000'
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
spec:
  replicas: 4
  model:
    uri: pvc://llm-d-model-qwen-qwen3-0-6b-fe62ee7991/model
    name: qwen-qwen3-0-6b
  template:
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    containers:
    - name: main
      resources:
        requests:
          nvidia.com/gpu: '4'
        limits:
          nvidia.com/gpu: '4'
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 900
        periodSeconds: 60
        timeoutSeconds: 60
        failureThreshold: 1000
      readinessProbe:
        failureThreshold: 10000
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 60
        periodSeconds: 30
        successThreshold: 1
        timeoutSeconds: 30
      env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --max-model-len=4096 --gpu-memory-utilization=0.92 --trust-remote-code
          --no-enable-log-requests --enable-prefix-caching --tensor-parallel-size=4
