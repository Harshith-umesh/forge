apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llm-d-pd-d.x2-p.tp4-d.tp4-p.x1
  namespace: forge-llm-d-qwen-qwen3-0-6b-pd-d-x2-p-tp4-d-tp4-p-x1
  annotations:
    security.opendatahub.io/enable-auth: 'false'
    prometheus.io/path: /metrics
    prometheus.io/port: '8000'
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
spec:
  replicas: 2
  model:
    uri: pvc://llm-d-model-qwen-qwen3-0-6b-fe62ee7991/model
    name: qwen-qwen3-0-6b
  router:
    scheduler:
      template:
        containers:
        - name: main
    route: {}
    gateway: {}
  template:
    serviceAccountName: llm-d-privileged
    containers:
    - name: main
      env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --max-model-len=4096 --gpu-memory-utilization=0.92 --trust-remote-code
          --no-enable-log-requests --enable-prefix-caching --tensor-parallel-size=4
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: UCX_IB_GID_INDEX
        value: '3'
      livenessProbe:
        failureThreshold: 1000
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 900
        periodSeconds: 60
        timeoutSeconds: 60
      readinessProbe:
        failureThreshold: 10000
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 60
        periodSeconds: 30
        successThreshold: 1
        timeoutSeconds: 30
      resources:
        limits:
          dra.llm-d.io/gpu-nic-pair: '4'
        requests:
          cpu: '4'
          dra.llm-d.io/gpu-nic-pair: '4'
          memory: 64Gi
      securityContext:
        capabilities:
          add:
          - IPC_LOCK
          - SYS_RAWIO
      startupProbe:
        failureThreshold: 150
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
  prefill:
    replicas: 2
    template:
      serviceAccountName: llm-d-privileged
      containers:
      - name: main
        env:
        - name: VLLM_ADDITIONAL_ARGS
          value: --max-model-len=4096 --gpu-memory-utilization=0.92 --trust-remote-code
            --no-enable-log-requests --enable-prefix-caching --tensor-parallel-size=4
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: UCX_IB_GID_INDEX
          value: '3'
        livenessProbe:
          failureThreshold: 1000
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 900
          periodSeconds: 60
          timeoutSeconds: 60
        readinessProbe:
          failureThreshold: 10000
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 30
        resources:
          limits:
            dra.llm-d.io/gpu-nic-pair: '4'
          requests:
            cpu: '4'
            dra.llm-d.io/gpu-nic-pair: '4'
            memory: 64Gi
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
            - SYS_RAWIO
        startupProbe:
          failureThreshold: 150
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
