apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llm-d-pd-d-x2-p-tp-bfb506
  namespace: forge-llm-d
  annotations:
    security.opendatahub.io/enable-auth: 'false'
    prometheus.io/path: /metrics
    prometheus.io/port: '8000'
    forge.openshift.io/deployment-profile: pd-d.x2-p.tp1-d.tp4-p.x8
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
spec:
  replicas: 2
  model:
    uri: pvc://llm-d-model-openai-gpt-oss-120b-7ab79ddecd/model
    name: openai-gpt-oss-120b
  router:
    scheduler:
      template:
        containers:
        - name: main
        nodeSelector:
          nvidia.com/gpu.present: 'true'
    route: {}
    gateway: {}
  template:
    containers:
    - name: main
      resources:
        requests:
          nvidia.com/gpu: '4'
          rdma/ib: '1'
        limits:
          nvidia.com/gpu: '4'
          rdma/ib: '1'
      env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --max-model-len=4096 --gpu-memory-utilization=0.92 --trust-remote-code
          --no-enable-log-requests --enable-prefix-caching --block-size 128 --kv-transfer-config
          '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
  prefill:
    replicas: 8
    template:
      containers:
      - name: main
        resources:
          requests:
            nvidia.com/gpu: '1'
            rdma/ib: '1'
          limits:
            nvidia.com/gpu: '1'
            rdma/ib: '1'
        env:
        - name: VLLM_ADDITIONAL_ARGS
          value: --max-model-len=4096 --gpu-memory-utilization=0.92 --trust-remote-code
            --no-enable-log-requests --enable-prefix-caching --block-size 128 --kv-transfer-config
            '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
